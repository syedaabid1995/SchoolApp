<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akacemify</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f8fb;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .card {
      background: #ffffff;
      padding: 48px 36px;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
      max-width: 720px;
      margin: 20px;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 600;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 42px;
      margin: 0 0 12px;
      color: #1f2937;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #4b5563;
      margin: 0 0 24px;
    }

    .links {
      margin-top: 28px;
    }

    .links a {
      display: inline-block;
      text-decoration: none;
      background: #111827;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 600;
    }

    .footer {
      margin-top: 28px;
      font-size: 14px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Coming Soon</div>
    <h1>Akacemify</h1>
    <p>
      A modern school management platform for institutions, staff, teachers,
      students, and parents.
    </p>
    <p>
      Our website is being prepared. Please check back soon.
    </p>
    <div class="links">
      <a href="https://app.akacemify.com">Go to App</a>
    </div>
    <div class="footer">
      © 2026 Akacemify. All rights reserved.
    </div>
  </main>
</body>
</html>

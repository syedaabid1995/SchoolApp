name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://academify_ci:academify_ci@localhost:5432/academify_ci
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: dummy_ci_jwt_secret_for_academify_tests_1234567890
      CORS_ORIGINS: http://localhost:3001
      FRONTEND_URL: http://localhost:3001
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: storage/runtime-ci
      RUN_API: "true"
      RUN_WORKERS: "false"
      RUN_SCHEDULERS: "false"
      ACADEMIFY_PROCESS_ROLE: api
      API_BASE_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: academify_ci
          POSTGRES_USER: academify_ci
          POSTGRES_PASSWORD: academify_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academify_ci -d academify_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Prisma schema validate
        working-directory: backend
        run: npx prisma validate

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Check compiled entrypoints
        working-directory: backend
        run: npm run runtime:check-entrypoints

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: Backend security tests
        working-directory: backend
        run: npm run test:security

      - name: Secret scan
        working-directory: backend
        run: npm run security:secrets

      - name: Scalability audit
        working-directory: backend
        run: npm run scalability:audit

      - name: Prod-lite verifier dry run
        working-directory: backend
        env:
          NODE_ENV: production
          STORAGE_DRIVER: s3
          S3_BUCKET: ci-academify-private
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: ci_access_key_not_real
          S3_SECRET_ACCESS_KEY: ci_secret_key_not_real
          CORS_ORIGINS: https://admin.ci.example
          FRONTEND_URL: https://admin.ci.example
          API_BASE_URL: https://api.ci.example/api/v1
          NEXT_PUBLIC_API_BASE_URL: https://api.ci.example/api/v1
        run: npm run prod-lite:verify

  admin:
    name: Admin checks
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      API_BASE_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Admin lint
        working-directory: admin
        run: npm run lint

      - name: Admin build
        working-directory: admin
        run: npm run build

  docker:
    name: Docker and Compose checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker version
        run: |
          docker --version
          docker compose version

      - name: Backend Docker build
        run: docker build -f docker/backend/Dockerfile backend

      - name: Compose config
        run: docker compose -f docker-compose.prod-lite.yml config

      - name: Compose config with storage profile
        run: docker compose -f docker-compose.prod-lite.yml --profile storage config

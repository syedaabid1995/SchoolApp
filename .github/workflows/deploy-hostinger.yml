name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    env:
      DEPLOY_HOST: ${{ secrets.HOSTINGER_HOST }}
      DEPLOY_PORT: ${{ secrets.HOSTINGER_PORT }}
      DEPLOY_USER: ${{ secrets.HOSTINGER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}

    steps:
      - name: Validate deploy secrets
        run: |
          set -e

          test -n "$DEPLOY_HOST" || { echo "Missing HOSTINGER_HOST secret"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Missing HOSTINGER_USER secret"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing HOSTINGER_SSH_KEY secret"; exit 1; }

      - name: Configure SSH
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/hostinger_deploy_key
          chmod 600 ~/.ssh/hostinger_deploy_key

          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on Hostinger
        run: |
          set -e

          ssh \
            -i ~/.ssh/hostinger_deploy_key \
            -p "${DEPLOY_PORT:-22}" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -se' <<'REMOTE_DEPLOY'
          set -e

          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
            nvm use --lts >/dev/null
          fi

          cd /var/www/academify

          git pull

          npm --prefix backend ci --include=dev
          npm --prefix backend run build
          npm --prefix backend run runtime:check-entrypoints

          cd backend
          set -a
          . ./.env
          set +a
          npx prisma migrate deploy
          cd ..

          npm --prefix admin ci --include=dev
          npm --prefix admin run build

          cd website
          npm install --include=dev
          npm run build
          cd ..

          cd /var/www/academify/backend
          set -a
          . ./.env
          set +a
          cd ..

          pm2 restart academify-api --update-env
          pm2 restart academify-worker --update-env
          pm2 restart academify-scheduler --update-env
          pm2 restart academify-admin --update-env
          pm2 save

          sudo -n nginx -t
          sudo -n systemctl reload nginx
          REMOTE_DEPLOY
